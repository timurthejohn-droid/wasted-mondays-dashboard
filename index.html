const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(P.iv)}, key, u8(P.data)));
  try { sessionStorage.setItem('wm-pass', pass) } catch(e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; go.textContent = 'Открываю…'; err.textContent = '';
  try { await open(document.getElementById('pw').value) }
  catch(x) { err.textContent = 'Неверный пароль'; go.disabled = false; go.textContent = 'Открыть'; }
});
let saved = null; try { saved = sessionStorage.getItem('wm-pass') } catch(e) {}
if (saved) open(saved).catch(() => { try { sessionStorage.removeItem('wm-pass') } catch(e) {} });
